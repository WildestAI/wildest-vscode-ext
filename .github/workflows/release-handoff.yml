name: Prepare verified extension release handoff

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      extension_version:
        description: Optional stable extension semver to prepare (without v; requires cli_release_tag)
        required: false
        type: string
      cli_release_tag:
        description: Optional published immutable wild CLI tag (derive both values automatically when blank)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: extension-release-handoff-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify CLI release and open extension release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an automatic or explicitly requested handoff
        id: handoff
        env:
          MANUAL_EXTENSION_VERSION: ${{ inputs.extension_version }}
          MANUAL_CLI_RELEASE_TAG: ${{ inputs.cli_release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { selectAutomaticHandoff } from './scripts/release/resolve-automatic-handoff.mjs';

          const manualVersion = process.env.MANUAL_EXTENSION_VERSION;
          const manualTag = process.env.MANUAL_CLI_RELEASE_TAG;
          if (Boolean(manualVersion) !== Boolean(manualTag)) {
            throw new Error('Provide both extension_version and cli_release_tag, or leave both blank for automatic discovery.');
          }
          let selected = manualVersion ? { extensionVersion: manualVersion, cliReleaseTag: manualTag } : undefined;
          if (!selected) {
            const currentVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
            const releases = JSON.parse(execFileSync(
              'gh',
              ['api', '--paginate', '--slurp', 'repos/WildestAI/wild/releases?per_page=100'],
              { encoding: 'utf8' },
            )).flat();
            selected = selectAutomaticHandoff(releases, currentVersion);
          }
          if (!selected) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'skip=true\n');
            console.log('No newer final immutable CLI release requires an extension handoff.');
          } else {
            appendFileSync(process.env.GITHUB_OUTPUT, `skip=false\nextension_version=${selected.extensionVersion}\ncli_release_tag=${selected.cliReleaseTag}\n`);
          }
          NODE
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.handoff.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.handoff.outputs.skip != 'true'
      - name: Refuse malformed or non-incrementing release inputs
        if: steps.handoff.outputs.skip != 'true'
        env:
          EXTENSION_VERSION: ${{ steps.handoff.outputs.extension_version }}
          CLI_RELEASE_TAG: ${{ steps.handoff.outputs.cli_release_tag }}
        run: node scripts/release/prepare-release-handoff.mjs --check "$EXTENSION_VERSION" "$CLI_RELEASE_TAG"
      - name: Verify the requested CLI release is published and final
        if: steps.handoff.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_RELEASE_TAG: ${{ steps.handoff.outputs.cli_release_tag }}
          CLI_REPOSITORY: WildestAI/wild
        run: |
          metadata="$(gh release view "$CLI_RELEASE_TAG" --repo "$CLI_REPOSITORY" --json tagName,isDraft,isImmutable,isPrerelease)"
          node -e 'const [metadata, tag] = process.argv.slice(1); const release = JSON.parse(metadata); if (release.tagName !== tag || release.isDraft || release.isPrerelease || !release.isImmutable) process.exit(1)' "$metadata" "$CLI_RELEASE_TAG"
      - name: Download and verify all locked CLI release assets
        if: steps.handoff.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_RELEASE_TAG: ${{ steps.handoff.outputs.cli_release_tag }}
          CLI_REPOSITORY: WildestAI/wild
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          gh release download "$CLI_RELEASE_TAG" --repo "$CLI_REPOSITORY" --dir "$temp_dir"
          node scripts/release/verify-cli-release.mjs "$temp_dir"
      - name: Run release-contract regression tests
        if: steps.handoff.outputs.skip != 'true'
        run: |
          npm run test:release-contract
          npm run test:release-handoff
          npm run test:automatic-release-handoff
          npm run test:release-candidate-state
          npm run test:release-candidate-pr-recovery
          npm run verify:release-input
      - name: Inspect existing release candidate without mutating it
        if: steps.handoff.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXTENSION_VERSION: ${{ steps.handoff.outputs.extension_version }}
          CLI_RELEASE_TAG: ${{ steps.handoff.outputs.cli_release_tag }}
        run: |
          branch="release/extension-v${EXTENSION_VERSION}"
          pull_requests_file="$(mktemp)"
          trap 'rm -f "$pull_requests_file"' EXIT
          # REST pagination avoids the default bounded `gh pr list` result set.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${branch}&per_page=100" \
            --jq '.[] | {number, state: (.state | ascii_upcase), mergedAt: .merged_at, headRefName: .head.ref}' | jq -s '.' > "$pull_requests_file"
          remote_ref_exists() {
            local kind="$1" ref="$2" output status
            if output="$(git ls-remote --exit-code "$kind" origin "$ref" 2>&1)"; then
              return 0
            fi
            status=$?
            if [ "$status" -eq 2 ]; then
              return 1
            fi
            printf 'Unable to inspect remote %s %s (exit %s): %s\n' "$kind" "$ref" "$status" "$output" >&2
            exit "$status"
          }
          branch_exists=false
          remote_ref_exists --heads "$branch" && branch_exists=true
          tag_exists=false
          remote_ref_exists --tags "refs/tags/v${EXTENSION_VERSION}" && tag_exists=true
          result="$(node scripts/release/release-candidate-state.mjs \
            "$branch" "$EXTENSION_VERSION" "$CLI_RELEASE_TAG" "$branch_exists" "$tag_exists" "$pull_requests_file")"
          state="$(node -e 'console.log(JSON.parse(process.argv[1]).state)' "$result")"
          message="$(node -e 'console.log(JSON.parse(process.argv[1]).message)' "$result")"
          printf 'Release candidate state: %s\n%s\n' "$state" "$message"
          printf '### Release candidate state\n\n- State: `%s`\n- %s\n' "$state" "$message" >> "$GITHUB_STEP_SUMMARY"
          test "$state" = 'no-candidate' || exit 1
      - name: Prepare the reviewable extension release candidate
        if: steps.handoff.outputs.skip != 'true'
        env:
          EXTENSION_VERSION: ${{ steps.handoff.outputs.extension_version }}
          CLI_RELEASE_TAG: ${{ steps.handoff.outputs.cli_release_tag }}
        run: |
          branch="release/extension-v${EXTENSION_VERSION}"
          git switch -c "$branch"
          node scripts/release/prepare-release-handoff.mjs "$EXTENSION_VERSION" "$CLI_RELEASE_TAG"
          npm run verify:release-input
          npm run package:preflight
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = $'package-lock.json\npackage.json\nrelease-inputs/diffgraph-cli.json'
      - name: Commit, push, and safely create or recover the release candidate PR
        if: steps.handoff.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXTENSION_VERSION: ${{ steps.handoff.outputs.extension_version }}
          CLI_RELEASE_TAG: ${{ steps.handoff.outputs.cli_release_tag }}
        run: |
          branch="release/extension-v${EXTENSION_VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json release-inputs/diffgraph-cli.json
          git commit -m "chore(release): prepare v${EXTENSION_VERSION} for ${CLI_RELEASE_TAG}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${branch}"
          pull_requests_file="$(mktemp)"
          trap 'rm -f "$pull_requests_file"' EXIT
          find_candidate_prs() {
            set -o pipefail
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${branch}&per_page=100" \
              --jq '.[] | {number, state: (.state | ascii_upcase), headRefName: .head.ref}' | jq -s '.' > "$pull_requests_file"
          }
          recovery_result() {
            node scripts/release/recover-release-candidate-pr.mjs "$branch" "$pull_requests_file"
          }
          find_candidate_prs
          result="$(recovery_result)"
          action="$(node -e 'console.log(JSON.parse(process.argv[1]).action)' "$result")"
          create_failed=false
          if [ "$action" = 'create-pr' ]; then
            if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "chore(release): prepare v${EXTENSION_VERSION}" \
              --body "Prepared from verified immutable CLI release \`${CLI_RELEASE_TAG}\`.\n\nThis PR does not tag or publish the extension. After review and merge, create \`v${EXTENSION_VERSION}\` to invoke the existing fail-closed tagged publisher."; then
              # A concurrent scheduler may have created the PR after our first read.
              create_failed=true
              find_candidate_prs
              result="$(recovery_result)"
              action="$(node -e 'console.log(JSON.parse(process.argv[1]).action)' "$result")"
            fi
          fi
          message="$(node -e 'console.log(JSON.parse(process.argv[1]).message)' "$result")"
          printf '### Release candidate PR recovery\n\n- Action: `%s`\n- %s\n' "$action" "$message" >> "$GITHUB_STEP_SUMMARY"
          if [ "$create_failed" = true ] && [ "$action" != 'use-existing-pr' ]; then
            echo "Unable to create the release candidate PR: $message" >&2
            exit 1
          fi
          test "$action" = 'create-pr' -o "$action" = 'use-existing-pr'
